name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: fmt + check + test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit toolchain (pinned by .moonbit-version)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Format check
        run: moon fmt --check
      - name: Check
        run: moon check --target ${{ matrix.target }} --deny-warn
      - name: Test
        run: moon test --target ${{ matrix.target }}
